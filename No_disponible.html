<body>

    <!-- CONTENEDOR CENTRAL -->
    <main class="status-container">
        <!-- Icono Reloj de Arena Editorial -->
        <div class="status-icon">
            <i class="fa-thin fa-hourglass-start"></i>
        </div>
        
        <!-- Mensaje de Estado -->
        <div class="status-content">
            <h1>Temporalmente <span>no disponible</span></h1>
            <p>Este perfil o catálogo exclusivo se encuentra pausado por motivos de exclusividad de marca internacional en la semana de la moda europea. Volverá a estar abierto para bookings comerciales en:</p>
            
            <!-- Contador Regresivo -->
            <div class="countdown-grid">
                <div class="countdown-item">
                    <div class="countdown-number" id="days">14</div>
                    <div class="countdown-label">Días</div>
                </div>
                <div class="countdown-item">
                    <div class="countdown-number" id="hours">08</div>
                    <div class="countdown-label">Hrs</div>
                </div>
                <div class="countdown-item">
                    <div class="countdown-number" id="minutes">45</div>
                    <div class="countdown-label">Min</div>
                </div>
            </div>

            <a href="/index" class="btn-status-return">Volver al Catálogo</a>
        </div>
    </main>

    <style>
        /* --- VARIABLES DE DISEÑO PREMIUM --- */
        :root {
            --bg-dark: #0a0a0a;
            --bg-card: #121212;
            --gold: #c5a880;
            --gold-hover: #e5c9a3;
            --text-main: #ffffff;
            --text-muted: #a3a3a3;
            --font-display: 'Cormorant Garamond', serif;
            --font-sans: 'Plus Jakarta Sans', sans-serif;
            --transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font-sans); background-color: var(--bg-dark); color: var(--text-main); overflow-x: hidden; min-height: 100vh; display: flex; flex-direction: column; justify-content: center;zoom:75%; }

        /* --- CONTENEDOR CENTRAL NO DISPONIBLE --- */
        .status-container { max-width: 800px; margin: 0 auto; padding: 6rem 2rem; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: calc(100vh - 200px); }

        /* Icono de Lujo Animado */
        .status-icon { font-size: 4rem; color: var(--gold); margin-bottom: 2rem; animation: pulseGlow 3s ease-in-out infinite; }
        
        .status-content h1 { font-family: var(--font-display); font-size: 2.8rem; font-weight: 400; margin-bottom: 1.5rem; letter-spacing: -0.5px; line-height: 1.2; }
        .status-content h1 span { color: var(--gold); font-style: italic; }
        .status-content p { color: var(--text-muted); font-size: 1rem; max-width: 550px; margin: 0 auto 3rem auto; font-weight: 300; line-height: 1.7; }

        /* Contador Regresivo Premium (Countdown Grid) */
        .countdown-grid { display: flex; gap: 1.5rem; margin-bottom: 4rem; justify-content: center; }
        .countdown-item { background: var(--bg-card); border: 1px solid rgba(197, 168, 128, 0.15); padding: 1.5rem; min-width: 90px; border-radius: 4px; }
        .countdown-number { font-family: var(--font-display); font-size: 2.5rem; color: var(--gold); line-height: 1; font-weight: 400; }
        .countdown-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 2px; color: var(--text-muted); margin-top: 0.5rem; }

        /* Botón de Retorno Extensible */
        .btn-status-return { display: inline-block; padding: 1rem 2.5rem; border: 1px solid var(--gold); color: var(--text-main); text-decoration: none; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 2px; transition: var(--transition); background: transparent; cursor: pointer; }
        .btn-status-return:hover { background: var(--gold); color: #000000; box-shadow: 0 10px 30px rgba(197, 168, 128, 0.15); transform: translateY(-2px); }

        /* --- ANIMACIONES --- */
        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; filter: drop-shadow(0 0 15px rgba(197, 168, 128, 0.3)); }
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 768px) {
            .status-content h1 { font-size: 2.2rem; }
            .countdown-grid { gap: 1rem; }
            .countdown-item { padding: 1rem; min-width: 75px; }
            .countdown-number { font-size: 1.8rem; }
        }
    </style>
    <!-- Script de Cuenta Regresiva Real -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Configura la fecha final deseada (Año, Mes - 1, Día, Hora, Minutos)
            // Ejemplo: 15 días a partir de hoy
            const targetDate = new Date();
            targetDate.setDate(targetDate.getDate() + 14);

            const updateCountdown = () => {
                const now = new Date().getTime();
                const difference = targetDate - now;

                if (difference <= 0) {
                    document.querySelector('.countdown-grid').innerHTML = "<div class='countdown-label' style='font-size:1rem; color:var(--gold)'>Bookings Disponibles Nuevamente</div>";
                    return;
                }

                const days = Math.floor(difference / (1000 * 60 * 60 * 24));
                const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));

                document.getElementById('days').innerText = days < 10 ? '0' + days : days;
                document.getElementById('hours').innerText = hours < 10 ? '0' + hours : hours;
                document.getElementById('minutes').innerText = minutes < 10 ? '0' + minutes : minutes;
            };

            setInterval(updateCountdown, 1000);
            updateCountdown();
        });
    </script>
