<body>

    <!-- CONTENEDOR CENTRAL -->
    <main class="error-container">
        <!-- Código de Error Estilizado -->
        <div class="error-code">404</div>
        
        <!-- Mensaje Editorial -->
        <div class="error-content">
            <h1>Fuera de <span>modelaje personal</span></h1>
            <p>La página que estás intentando buscar no existe, ha cambiado de ubicación editorial o se encuentra temporalmente fuera de nuestra cartelera comercial.</p>
            <a href="/index" class="btn-error-return">Volver al Inicio</a>
        </div>
    </main>

    <style>
        /* --- VARIABLES DE DISEÑO PREMIUM --- */
        :root {
            --bg-dark: #0a0a0a;
            --gold: #c5a880;
            --gold-hover: #e5c9a3;
            --text-main: #ffffff;
            --text-muted: #a3a3a3;
            --font-display: 'Cormorant Garamond', serif;
            --font-sans: 'Plus Jakarta Sans', sans-serif;
            --transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font-sans); background-color: var(--bg-dark); color: var(--text-main); overflow-x: hidden; min-height: 100vh; display: flex; flex-direction: column; justify-content: center;zoom:75%; }

        /* --- CONTENEDOR CENTRAL 404 --- */
        .error-container { max-width: 800px; margin: 0 auto; padding: 6rem 2rem; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: calc(100vh - 200px); }

        /* Estética del Número Desvanecido */
        .error-code { font-family: var(--font-display); font-size: 10rem; font-weight: 400; line-height: 1; color: transparent; -webkit-text-stroke: 1px rgba(197, 168, 128, 0.3); letter-spacing: -2px; margin-bottom: 1rem; animation: floatNumber 6s ease-in-out infinite; }
        
        .error-content h1 { font-family: var(--font-display); font-size: 2.8rem; font-weight: 400; margin-bottom: 1.5rem; letter-spacing: -0.5px; }
        .error-content h1 span { color: var(--gold); font-style: italic; }
        .error-content p { color: var(--text-muted); font-size: 1rem; max-width: 500px; margin: 0 auto 3rem auto; font-weight: 300; line-height: 1.7; }

        /* Botón de Retorno de Lujo */
        .btn-error-return { display: inline-block; padding: 1rem 2.5rem; border: 1px solid var(--gold); color: var(--text-main); text-decoration: none; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 2px; transition: var(--transition); background: transparent; cursor: pointer; }
        .btn-error-return:hover { background: var(--gold); color: #000000; box-shadow: 0 10px 30px rgba(197, 168, 128, 0.15); transform: translateY(-2px); }

        /* --- ANIMACIÓN FLOTANTE PREMIUM --- */
        @keyframes floatNumber {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 768px) {
            .error-code { font-size: 7rem; }
            .error-content h1 { font-size: 2.2rem; }
            .error-container { padding: 4rem 1.5rem; }
        }
    </style>
</body>
</html>
